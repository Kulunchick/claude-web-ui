[package]
name = "claude-web-ui-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
claude-web-ui-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
url = { version = "2", features = ["serde"] }
uuid.workspace = true
futures-util = "0.3"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["macros", "time"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

[build-dependencies]
tauri-build = "2"
