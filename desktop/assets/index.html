<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gateway Profiles</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./profiles.js" defer></script>
</head>
<body>
  <main>
    <h1>Gateway Profiles</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <section aria-labelledby="connection">
      <h2 id="connection">Connection</h2>
      <label for="profile">Active Gateway</label>
      <select id="profile"></select>
      <form id="signin">
        <label for="identifier">Username or email</label>
        <input id="identifier" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div class="actions">
          <button type="submit">Sign in</button>
          <button type="button" id="open">Open Dashboard</button>
        </div>
      </form>
      <details id="jwt-settings">
        <summary>Use Gateway JWTs</summary>
      <form id="credentials">
        <label for="access-token">Access JWT</label>
        <input id="access-token" type="password" autocomplete="off" required>
        <label for="refresh-token">Refresh JWT <span>(optional)</span></label>
        <input id="refresh-token" type="password" autocomplete="off">
        <div class="actions">
          <button type="submit">Save credentials</button>
        </div>
      </form>
      </details>
    </section>
    <section aria-labelledby="add-gateway">
      <h2 id="add-gateway">Add a Gateway</h2>
      <form id="add">
        <label for="name">Profile name</label>
        <input id="name" required>
        <label for="origin">Gateway URL</label>
        <input id="origin" type="url" placeholder="https://gateway.example" required>
        <div class="actions">
          <button type="submit">Add profile</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
