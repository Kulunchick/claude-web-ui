[package]
name = "claude-web-ui-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
claude-web-ui-shared = { path = "../shared" }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
argon2 = "0.5"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
rust-embed = "8"
mime_guess = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
croner = "3"
tokio-cron-scheduler = "0.15"
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
portable-pty = "0.9"
serde_yaml_ng = "0.10"
toml = "1"
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend"] }

hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
futures-util = "0.3"
